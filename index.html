main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 16px}
.view{animation:fade .5s}@keyframes fade{from{opacity:0;transform:translateY(10px)}}

.stage{display:flex;align-items:center;gap:10px;margin:18px 0;background:#fff;border-radius:var(--r);box-shadow:0 6px 24px #7d010122;overflow:hidden;padding:18px 0}

.sh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:34px 0 14px;border-bottom:2px dashed var(--soft);padding-bottom:6px}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}

.tools input,.tools select{width:auto;flex:1;min-width:140px}
.book{cursor:pointer;background:var(--m);color:#fff;border-radius:3px 10px 10px 3px;border-left:10px solid #4a0000}

.tl{border-left:3px solid var(--soft);margin-left:8px;padding-left:18px}

.wall{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;padding:10px}
.pol{background:#fff;padding:10px 10px 14px;width:210px;box-shadow:0 5px 14px #0004;position:relative;transition:.25s;color:#3b2a24}
.pol:hover{transform:rotate(0) scale(1.05)!important;z-index:3}
.pol img{width:100%;height:190px;object-fit:cover;display:block}
.pol p{font-family:'Caveat Brush',cursive;margin:8px 0 0;text-align:center;font-size:18px}

.song{display:flex;gap:12px;align-items:center}

.note{background:#fff3b8;transform:rotate(-1.5deg)}.note:nth-child(even){transform:rotate(1.5deg);background:#ffd9d9}
.adm{display:none;position:absolute;top:4px;right:4px;gap:2px}
body.edit .adm{display:flex}
.adm button{border:0;background:#fff;border-radius:4px;padding:2px 6px;box-shadow:0 1px 3px #0004}
.fav{position:absolute;bottom:6px;right:10px;background:none;border:0;font-size:20px;color:var(--m)}
.tag{font-size:11px;background:var(--m);color:#fff;border-radius:10px;padding:1px 8px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.stats span{background:#fff;border:1px dashed var(--m);border-radius:var(--r);padding:6px 12px;font-size:13px}
.fh{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.fh img{width:150px;height:150px;object-fit:cover;border:8px solid #fff;box-shadow:0 4px 14px #0004;transform:rotate(-3deg)}
.fh h1{font-size:56px}
#modal{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.sheet{background:var(--paper);max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:26px;border-radius:var(--r);box-shadow:0 12px 40px #0008;transform-origin:left;animation:flip .6s}
@keyframes flip{from{transform:perspective(900px) rotateY(-70deg);opacity:0}}
.sheet.paper{background:repeating-linear-gradient(#f6ecdc 0 27px,#e2d3bd 28px);line-height:28px;font-size:17px}
.sheet label{display:block;margin:10px 0 3px;font-size:13px}
.sheet .pre{white-space:pre-wrap}
.sheet img.ph{max-width:60%;background:#fff;padding:8px;box-shadow:0 3px 8px #0004;transform:rotate(3deg);display:block;margin:12px auto}
#player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--m);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));border-radius:var(--r) var(--r) 0 0}
#player .mini{width:44px;height:44px;flex:none;margin:0;border-radius:50%;background:#111;animation:spin 3s linear infinite;animation-play-state:paused;border:8px solid #111;box-shadow:inset 0 0 0 8px #ffffff22}
#player.on .mini{animation-play-state:running}
#pt{flex:1;font-size:13px;min-width:0}
#pf iframe{border:0;width:280px;height:80px;border-radius:8px}
@media(max-width:700px){.disc{width:130px;height:130px;margin-left:-60px}.disc:after{inset:42px;font-size:12px}.car{height:220px}.car div{width:100px;height:150px;margin:-75px 0 0 -50px}#pf iframe{width:170px;height:70px}}
.car{height:400px}.car div{width:230px;height:320px;margin:-160px 0 0 -115px}
.disc{width:290px;height:290px;margin-left:-130px}.disc:after{inset:95px}
.folder{background:#e6c9a8;text-align:center;cursor:pointer;padding:34px 16px 22px;border-radius:0 var(--r) var(--r) var(--r)}
.folder:before{top:-16px;left:0;width:96px;height:16px;margin:0;background:#e6c9a8;border-radius:8px 8px 0 0;transform:none}
.folder h3{font-size:30px}

.sheet.note:before{content:"";position:absolute;top:10px;left:0;right:0;height:16px;background:radial-gradient(circle,#3b2a2455 5px,transparent 6px) 0 0/34px 16px repeat-x}
.sheet.note h2{font-size:34px;line-height:32px;margin:0}
.sheet.note .pre{white-space:pre-wrap;line-height:32px}
.sheet.note .sg{font-size:30px;text-align:right;line-height:32px}
@keyframes unfold{from{transform:scaleY(.05);opacity:0}}
#player{flex-wrap:wrap;row-gap:0}#pf{order:-1;flex-basis:100%}#pf iframe{width:100%;max-width:560px;display:block;margin:0 auto 8px;border-radius:12px}

<script data-app="">
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='lettersForMySix_v1';
const ph=n=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#c98a8a"/><text x="150" y="195" font-size="130" text-anchor="middle" fill="#7D0101" font-family="Georgia">${esc((n||'?')[0])}</text></svg>`);
let S=null;try{S=JSON.parse($('#data').textContent)}catch(e){}const fresh=!S;
if(!S)S={friends:[1,2,3,4,5,6].map(i=>({id:'f'+i,name:'Friend '+i,quote:'"Write a little quote for them here."',intro:'A few words about who they are to me.',photo:''})),items:[]};
let st;const save=()=>{clearTimeout(st);st=setTimeout(()=>pub(),600)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const F=id=>S.friends.find(f=>f.id==id)||{name:'?'},av=f=>f.photo||ph(f.name);
const T={letter:{l:'Letter',f:'title date text sign img'},memory:{l:'Memory',f:'title date text img'},photo:{l:'Photo',f:'img title date'},song:{l:'Song',f:'title artist link img text'},note:{l:'Note',f:'text'}};
const L={title:'Title / Caption',date:'Date',text:'Message',sign:'Signature',img:'Photo',link:'Spotify / YouTube link',artist:'Artist'};
const L2={letter:{text:'Letter content'},memory:{text:'Description'},song:{text:'Why this song is special to us'},note:{text:'Short text'}};
let edit=false,P=null;
const list=(t,f)=>S.items.filter(i=>i.type==t&&(!f||i.fid==f));
const addBtn=(t,f)=>!edit?'':`<button class="btn" onclick="openForm('${t}','${f||''}')">+ Add ${T[t].l}</button>`;
const adm=id=>`<span class="adm"><button onclick="mv('${id}',-1)">↑</button><button onclick="mv('${id}',1)">↓</button><button onclick="openForm(null,null,'${id}')">✎</button><button onclick="del('${id}')">✕</button></span>`;
const empty='<p style="opacity:.6;font-style:italic">Nothing here yet ✿</p>';
const ds=i=>`data-s="${esc((i.title+' '+i.text+' '+F(i.fid).name).toLowerCase())}" data-d="${i.date||''}" data-f="${i.fav?1:0}"`;
const fdate=d=>d?new Date(d+'T12:00').toLocaleDateString('en',{year:'numeric',month:'long',day:'numeric'}):'';
const rot=id=>((parseInt(id.slice(-3),36)%9)-4);

function cLetter(i){return `<div class="card book" ${ds(i)} onclick="openReader('${i.id}')">${adm(i.id)}<small>${fdate(i.date)}</small><h3>${esc(i.title||'Untitled')}</h3><small>for ${esc(F(i.fid).name)} · tap to open ✉</small></div>`}
function cMem(i){return `<div class="card" ${ds(i)}>${adm(i.id)}<small>${fdate(i.date)} <span class="tag">${esc(F(i.fid).name)}</span></small><h3>${esc(i.title)}</h3><div class="pre" style="white-space:pre-wrap">${esc(i.text)}</div>${i.img?`<img src="${i.img}">`:''}<button class="fav" onclick="fav('${i.id}')">${i.fav?'♥':'♡'}</button></div>`}
function cPhoto(i){return `<div class="pol" ${ds(i)} style="transform:rotate(${rot(i.id)}deg)">${adm(i.id)}<img src="${i.img}"><p>${esc(i.title)}</p><small>${fdate(i.date)} · ${esc(F(i.fid).name)}</small></div>`}
function cSong(i){return `<div class="card song" ${ds(i)}>${adm(i.id)}<img src="${i.img||ph('♪')}"><div style="flex:1"><b>${esc(i.title)}</b><small>${esc(i.artist)} · <span class="tag">${esc(F(i.fid).name)}</span></small><p>${esc(i.text)}</p><button class="btn" onclick="play('${i.id}')">▶ Play</button></div></div>`}
function cNote(i){return `<div class="card note" ${ds(i)}>${adm(i.id)}<div style="white-space:pre-wrap">${esc(i.text)}</div></div>`}
const C={letter:cLetter,memory:cMem,photo:cPhoto,song:cSong,note:cNote};
function block(t,f,title,wrap){const a=list(t,f).map(C[t]).join('');const body=!a?empty:t=='photo'?`<div class="wall">${a}</div>`:t=='memory'?`<div class="tl">${a}</div>`:`<div class="grid" ${t=='letter'?'':'style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))"'}>${a}</div>`;return `<div class="sh"><h2>${title}</h2>${addBtn(t,f)}</div>${body}`}
const filters=`<div class="tools"><input id="q" placeholder="🔍 Search…" oninput="filt()"><input id="mo" type="month" onchange="filt()" title="Filter by month"><label style="display:flex;align-items:center;gap:4px;font-size:13px"><input type="checkbox" id="fv" style="width:auto" onchange="filt()">♥ only</label></div>`;
function filt(){const q=($('#q')||{}).value?.toLowerCase()||'',m=($('#mo')||{}).value||'',fv=$('#fv')?.checked;document.querySelectorAll('[data-s]').forEach(e=>{e.style.display=(e.dataset.s.includes(q)&&(!m||e.dataset.d.startsWith(m))&&(!fv||e.dataset.f=='1'))?'':'none'})}

function fCards(){return `<div class="grid">${S.friends.map(f=>`<div class="card friend"><span class="adm"><button onclick="openFriend('${f.id}')">✎</button></span><img class="av" src="${av(f)}"><h3>${esc(f.name)}</h3><i>${esc(f.quote)}</i><a class="btn" href="#/f/${f.id}" style="text-decoration:none;display:inline-block">Open Letter</a></div>`).join('')}</div>`}
const stats=()=>`<div class="stats"><span>✉ ${list('letter').length} letters</span><span>❀ ${list('memory').length} memories</span><span>📷 ${list('photo').length} photos</span><span>♪ ${list('song').length} songs</span><span>✎ ${list('note').length} notes</span></div>`;
function views(r){
 const [p,id]=r;
 if(p=='six')return `<div class="hero"><h1>The Six</h1></div>${fCards()}`;
 if(p=='f'){const f=F(id);return `<div class="fh"><img src="${av(f)}"><div><h1>${esc(f.name)}</h1><i>${esc(f.quote)}</i><p>${esc(f.intro)}</p><button class="btn o" onclick="openFriend('${id}')">✎ Edit name, quote & photo</button></div></div>${block('letter',id,'My Letter to You')}${block('memory',id,'Memories')}${block('photo',id,'Photos')}${block('song',id,'Our Songs')}${block('note',id,'Little Notes')}<p style="text-align:center;margin-top:40px"><a class="btn" href="#/six" style="text-decoration:none">← Back to the Six</a></p>`}
 if(p=='letters')return `<div class="hero"><h1>Letters</h1><button class="btn o" onclick="rndLetter()">✉ Open a random letter</button></div>${filters}${block('letter',0,'All Letters')}`;
 if(p=='memories')return `<div class="hero"><h1>Memory Timeline</h1><button class="btn o" onclick="rndMem()">✿ Random memory</button></div>${filters}${block('memory',0,'Memories')}`;
 if(p=='photos')return `<div class="hero"><h1>Memorizz</h1></div>${filters}${block('photo',0,'Memory Scrapbook')}`;
 if(p=='music')return `<div class="hero"><h1>Our Soundtrack</h1></div>${filters}${block('song',0,'Songs')}`;
 const d=new Date(),k=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 const otd=S.items.filter(i=>['memory','photo'].includes(i.type)&&(i.date||'').slice(5)==k);
 return `<div class="hero"></div>
 <div class="stage"><div class="disc" id="disc"></div><div class="car" id="car"></div></div>${stats()}
 <div class="tools" style="justify-content:center"><button class="btn o" onclick="rndLetter()">✉ Open a random letter</button><button class="btn o" onclick="rndMem()">✿ Random memory</button></div>
 <div class="sh"><h2>The Six</h2></div>${fCards()}
 <div class="sh"><h2>On This Day</h2></div>${otd.length?`<div class="grid">${otd.map(i=>C[i.type](i)).join('')}</div>`:'<p style="opacity:.6;font-style:italic">No memories on this day yet.</p>'}`}

function render(){
 const r=location.hash.replace('#/','').split('/'),p=r[0]||'home';
 const nav=[['','Home'],['six','The Six'],['letters','Letters'],['memories','Memories'],['photos','Photos'],['music','Music']];
 $('#nav').innerHTML=nav.map(([h,n])=>`<a href="#/${h}" class="${(p==(h||'home')||(p=='f'&&h=='six'))?'on':''}">${n}</a>`).join('')+`<span class="sp"></span>${edit?'<button class="btn" onclick="exp()">⬇ Backup</button>':''}<button class="btn" id="em" onclick="toggleEdit()">${edit?'✔ Editing':'✎ Edit Mode'}</button>`;
 $('#main').innerHTML=`<div class="view">${views([p,r[1]])}</div>`;
 document.body.classList.toggle('edit',edit);
 if($('#car'))startCar();
 window.scrollTo(0,0);
}
const toggleEdit=()=>{edit=!edit;try{sessionStorage.setItem('e',edit?1:0)}catch(e){}const y=scrollY;render();scrollTo(0,y)};
addEventListener('hashchange',()=>render());
function refresh(){const y=scrollY;render();scrollTo(0,y)}

let ct;function startCar(){clearInterval(ct);const car=$('#car');let cur=0;const pics=S.friends.map(av);
 car.innerHTML=pics.map(s=>`<div style="background-image:url('${s}')"></div>`).join('');
 const go=()=>{const w=car.clientWidth/5.2;[...car.children].forEach((e,i)=>{const o=((i-cur+9)%6)-3;e.style.transform=`translateX(${o*w}px) rotateY(${-o*28}deg) scale(${o==0?1.2:1-Math.abs(o)*.15})`;e.style.zIndex=10-Math.abs(o);e.style.opacity=o==-3?0:1});cur=(cur+1)%6};
 go();ct=setInterval(()=>{if(!$('#car'))return clearInterval(ct);go()},3000)}

function closeM(){$('#modal').classList.remove('on')}
function modal(h,paper){$('#modal').innerHTML=`<div class="sheet ${paper?'paper':''}">${h}<p style="text-align:right;margin:10px 0 0"><button class="btn o" onclick="closeM()">Close</button></p></div>`;$('#modal').classList.add('on')}
function openReader(id){const i=S.items.find(x=>x.id==id);if(!i)return;
 modal(i.type=='letter'?`<small>${fdate(i.date)}</small><h2>Dear ${esc(F(i.fid).name)},</h2><div class="pre">${esc(i.text)}</div>${i.sign?`<p class="hw" style="font-size:26px;text-align:right">${esc(i.sign)}</p>`:''}${i.img?`<img class="ph" src="${i.img}">`:''}`:`<small>${fdate(i.date)}</small><h2>${esc(i.title)}</h2><div class="pre">${esc(i.text)}</div>${i.img?`<img class="ph" src="${i.img}">`:''}`,true)}
const rndLetter=()=>{const a=list('letter');a.length?openReader(a[Math.floor(Math.random()*a.length)].id):alert('Add a letter first ✉')};
const rndMem=()=>{const a=list('memory');a.length?openReader(a[Math.floor(Math.random()*a.length)].id):alert('Add a memory first ✿')};

function openForm(type,fid,id){const it=id?S.items.find(x=>x.id==id):null;type=type||it.type;
 const fs=T[type].f.split(' ');
 modal(`<h2>${it?'Edit':'Add'} ${T[type].l}</h2><form id="frm" onsubmit="return false"><label>For</label><select name="fid">${S.friends.map(f=>`<option value="${f.id}" ${(it?it.fid:fid)==f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select>`+
 fs.map(k=>{const lab=(L2[type]||{})[k]||L[k],v=it?esc(it[k]):'';return `<label>${lab}${k=='img'?' (optional)':''}</label>`+(k=='text'?`<textarea name="text" rows="${type=='letter'?9:4}">${v}</textarea>`:k=='img'?`<input type="file" name="img" accept="image/*">`:`<input name="${k}" type="${k=='date'?'date':k=='link'?'url':'text'}" value="${v}" ${k=='date'&&!it?`value="${new Date().toISOString().slice(0,10)}"`:''}>`)}).join('')+
 `<p><button class="btn" onclick="saveItem('${type}','${id||''}')">Save</button></p></form>`)}
function resize(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};im.src=r.result};r.readAsDataURL(file)})}
